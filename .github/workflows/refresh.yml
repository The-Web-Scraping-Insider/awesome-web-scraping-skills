name: Refresh stats and README

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  push:
    branches: [main]
    paths:
      - "data/*.yaml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate data
        run: python scripts/validate.py

      - name: Fetch stars and installs
        # Only on the schedule or a manual run; pushes just re-render.
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py

      - name: Render README and pages
        run: python scripts/render.py

      - name: Commit changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "awesome-scraping-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "${{ github.event_name }}" = "push" ]; then
            git commit -m "📝 Re-render README"
          else
            git commit -m "📊 Stats update $(date -u +%F)"
          fi
          git push
