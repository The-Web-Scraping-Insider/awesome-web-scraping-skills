# Source of truth for the list. README.md and the pages in categories/ and
# vendors/ are generated from this file by scripts/render.py. Edit here, never
# in README.md.
#
# Fields
#   id           unique slug
#   name         skill name as published (several related skills may share one entry)
#   vendor       id from vendors.yaml, for official skills; omit for community skills
#   author       GitHub user/org, for community skills
#   type         official-vendor | official-tool | community
#   category     see data/categories.yaml
#   repo         owner/repo on GitHub (used for stars). Omit if not on GitHub.
#   catalog      true if the repo is a multi-purpose collection, so its stars say little about this skill
#   url          link, if it differs from https://github.com/<repo>
#   description  one sentence, no marketing language
#   paid_api     true if the skill needs a paid account or API key to be useful
#   capabilities tags from data/capabilities.yaml
#   install      install command
#   skills_sh    "owner/repo/skill" path on skills.sh, for install counts (optional)
#   added        date added to this list

